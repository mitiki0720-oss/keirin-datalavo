name: Notify Slack Hits

on:
  push:
    branches:
      - main
    paths:
      - "public/data/predictions/saved-predictions.generated.json"
      - "public/data/races/today.generated.json"
      - "scripts/notify-slack-hits.mjs"
      - "scripts/lib/slack-notification-ledger.mjs"
      - "src/lib/reviewPerformanceMetrics.ts"
      - "src/lib/keirinPredictionCanonicalFormat.ts"
      - ".github/workflows/notify-slack-hits.yml"
  workflow_run:
    workflows:
      - Update today race data
    types:
      - completed

permissions:
  actions: read
  contents: write

jobs:
  notify-slack-hits:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    concurrency:
      group: keirin-slack-hit-state
      cancel-in-progress: false

    steps:
      - name: Check upstream race update was performed
        id: upstream_update
        uses: actions/github-script@v7
        with:
          script: |
            let runFollowup = true;
            if (context.eventName === 'workflow_run') {
              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                ...context.repo, run_id: context.payload.workflow_run.id, filter: 'latest', per_page: 100,
              });
              const job = jobs.find((item) => item.name === 'update-race-data');
              const step = job?.steps?.find((item) => item.name === 'Update today race data');
              if (!step || !['success', 'skipped'].includes(step.conclusion)) {
                throw new Error('Unable to verify upstream race update; refusing follow-up');
              }
              runFollowup = step.conclusion === 'success';
              if (!runFollowup) {
                core.notice('Upstream race update was skipped; no deployment or Slack delivery');
                await core.summary.addHeading('更新スキップのため後続処理なし')
                  .addRaw('元のデータ更新ステップがスキップされたため、公開・通知は実行しません。\n')
                  .write();
              }
            }
            core.setOutput('run_followup', String(runFollowup));

      - name: Checkout
        if: steps.upstream_update.outputs.run_followup == 'true'
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Setup Node
        if: steps.upstream_update.outputs.run_followup == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4

      - name: Sync latest main
        if: steps.upstream_update.outputs.run_followup == 'true'
        run: git pull --ff-only origin main

      - name: Reserve new Slack hits (no delivery)
        if: steps.upstream_update.outputs.run_followup == 'true'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: node scripts/notify-slack-hits.mjs --prepare --plan-path "$RUNNER_TEMP/slack-hit-plan.json"

      - name: Persist reservations before delivery
        if: steps.upstream_update.outputs.run_followup == 'true'
        run: |
          if git diff --quiet .github/state/slack-hit-notifications.json; then
            echo "No reservation changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- .github/state/slack-hit-notifications.json
          git commit -m "Reserve Slack hit notifications"
          for attempt in 1 2 3; do
            git pull --rebase origin main || exit 1
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1

      - name: Deliver reserved Slack hits
        if: steps.upstream_update.outputs.run_followup == 'true'
        id: deliver
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_RESERVATION_PERSISTED: "true"
        run: node scripts/notify-slack-hits.mjs --deliver --plan-path "$RUNNER_TEMP/slack-hit-plan.json"

      - name: Persist delivery outcome
        if: steps.upstream_update.outputs.run_followup == 'true' && (always() && (steps.deliver.outcome == 'success' || steps.deliver.outcome == 'failure'))
        run: |
          if git diff --quiet .github/state/slack-hit-notifications.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- .github/state/slack-hit-notifications.json
          git commit -m "Record Slack hit delivery outcomes"
          for attempt in 1 2 3; do
            git pull --rebase origin main || exit 1
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
