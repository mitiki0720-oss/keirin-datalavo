name: Notify Slack Hits

on:
  push:
    branches:
      - main
    paths:
      - "public/data/predictions/saved-predictions.generated.json"
      - "public/data/races/today.generated.json"
      - "scripts/notify-slack-hits.mjs"
      - ".github/workflows/notify-slack-hits.yml"

permissions:
  contents: write

jobs:
  notify-slack-hits:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Notify Slack hits
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: node scripts/notify-slack-hits.mjs

      - name: Commit notified hit keys
        run: |
          if git diff --quiet public/data/predictions/saved-predictions.generated.json; then
            echo "No notification state changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/predictions/saved-predictions.generated.json
          git commit -m "Update Slack notified hit keys"
          git push