name: Notify Slack Hits

on:
  push:
    branches:
      - main
    paths:
      - "public/data/predictions/saved-predictions.generated.json"
      - "public/data/races/today.generated.json"
      - "scripts/notify-slack-hits.mjs"
      - "scripts/lib/slack-notification-ledger.mjs"
      - "src/lib/reviewPerformanceMetrics.ts"
      - "src/lib/keirinPredictionCanonicalFormat.ts"
      - ".github/workflows/notify-slack-hits.yml"
  workflow_run:
    workflows:
      - Update today race data
    types:
      - completed

permissions:
  contents: write

jobs:
  notify-slack-hits:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    concurrency:
      group: keirin-slack-hit-state
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4

      - name: Sync latest main
        run: git pull --ff-only origin main

      - name: Reserve new Slack hits (no delivery)
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: node scripts/notify-slack-hits.mjs --prepare --plan-path "$RUNNER_TEMP/slack-hit-plan.json"

      - name: Persist reservations before delivery
        run: |
          if git diff --quiet .github/state/slack-hit-notifications.json; then
            echo "No reservation changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- .github/state/slack-hit-notifications.json
          git commit -m "Reserve Slack hit notifications"
          for attempt in 1 2 3; do
            git pull --rebase origin main || exit 1
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1

      - name: Deliver reserved Slack hits
        id: deliver
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_RESERVATION_PERSISTED: "true"
        run: node scripts/notify-slack-hits.mjs --deliver --plan-path "$RUNNER_TEMP/slack-hit-plan.json"

      - name: Persist delivery outcome
        if: always() && (steps.deliver.outcome == 'success' || steps.deliver.outcome == 'failure')
        run: |
          if git diff --quiet .github/state/slack-hit-notifications.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- .github/state/slack-hit-notifications.json
          git commit -m "Record Slack hit delivery outcomes"
          for attempt in 1 2 3; do
            git pull --rebase origin main || exit 1
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
