name: Update today race data

on:
  schedule:
    # GitHub ActionsのcronはUTC。
    # 0-14時 UTC = 日本時間 9-23時。
    # 日本時間 9:00〜23:30に30分ごと実行。
    - cron: "*/30 0-14 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-today-race-data
  cancel-in-progress: false

jobs:
  update-build-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Update today race data
        run: node scripts/update-today-races.mjs

      - name: Commit today race data
        run: |
          if git diff --quiet public/data/races/today.generated.json; then
            echo "No today race data changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/races/today.generated.json
          git commit -m "Update today race data"
          git pull --rebase origin main
          git push

      - name: Build for GitHub Pages
        run: npm run build:github

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4