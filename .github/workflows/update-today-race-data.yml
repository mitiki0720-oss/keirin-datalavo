name: Update today race data

on:
  schedule:
    - cron: "0 23 * * *"   # 08:00 JST lineup + morning odds seed
    - cron: "0 1 * * *"    # 10:00 JST day odds
    - cron: "0 5 * * *"    # 14:00 JST night odds
    - cron: "0 8 * * *"    # 17:00 JST midnight lineup
    - cron: "0 11 * * *"   # 20:00 JST midnight odds
    - cron: "*/30 0-14 * * *" # result refresh window (pending races only by script)
    - cron: "47 14 * * *"  # 23:47 JST final result pickup
    - cron: "53 14 * * *"  # 23:53 JST backfill pickup
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-today-race-data
  cancel-in-progress: false

jobs:
  update-build-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync latest main
        run: |
          git pull --ff-only origin main

      - name: Update today race data
        run: |
          PHASE_ARG=""
          case "${{ github.event.schedule }}" in
            "0 23 * * *")
              PHASE_ARG="--phase lineup"
              ;;
            "0 1 * * *"|"0 5 * * *"|"0 11 * * *")
              PHASE_ARG="--phase odds"
              ;;
            "0 8 * * *")
              PHASE_ARG="--phase lineup"
              ;;
            "*/30 0-14 * * *")
              PHASE_ARG="--phase result"
              ;;
            "47 14 * * *")
              PHASE_ARG="--phase final"
              ;;
            "53 14 * * *")
              PHASE_ARG="--phase backfill"
              ;;
          esac

          if [ -n "$PHASE_ARG" ]; then
            npm run update:today-races:write -- $PHASE_ARG
          else
            npm run update:today-races:write
          fi

      - name: Notify Slack hits
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: node scripts/notify-slack-hits.mjs

      - name: Commit updated race and notification data
        id: commit_updated_data
        run: |
          if git diff --quiet public/data/races/today.generated.json public/data/predictions/saved-predictions.generated.json; then
            echo "No today race data or Slack notification state changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add public/data/races/today.generated.json
          git add public/data/predictions/saved-predictions.generated.json

          git commit -m "Update today race data and Slack notification state"
          git pull --rebase origin main
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Build for GitHub Pages
        if: steps.commit_updated_data.outputs.changed == 'true'
        run: npm run build:github

      - name: Upload GitHub Pages artifact
        if: steps.commit_updated_data.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        if: steps.commit_updated_data.outputs.changed == 'true'
        id: deployment
        uses: actions/deploy-pages@v4