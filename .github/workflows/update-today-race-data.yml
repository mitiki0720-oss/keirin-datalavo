name: Update today race data

on:
  schedule:
    - cron: "10 21 * * *"  # 06:10 JST upcoming schedule
    - cron: "0 23 * * *"   # 08:00 JST lineup + morning odds seed
    - cron: "0 1 * * *"    # 10:00 JST day odds
    - cron: "0 5 * * *"    # 14:00 JST night odds
    - cron: "0 8 * * *"    # 17:00 JST midnight lineup
    - cron: "0 11 * * *"   # 20:00 JST midnight odds
    - cron: "30 0-14 * * *" # result refresh window: half-hour checkpoints
    - cron: "0 0-2,4-5,7-8,10-11,13-14 * * *" # result refresh window: top-of-hour checkpoints
    - cron: "0 3 * * *"     # 12:00 JST KEIRIN.JP official checkpoint
    - cron: "0 6 * * *"     # 15:00 JST KEIRIN.JP official checkpoint
    - cron: "0 9 * * *"     # 18:00 JST KEIRIN.JP official checkpoint
    - cron: "0 12 * * *"    # 21:00 JST KEIRIN.JP official checkpoint
    - cron: "47 14 * * *"  # 23:47 JST final result pickup
    - cron: "53 14 * * *"  # 23:53 JST backfill pickup
  workflow_dispatch:
    inputs:
      phase:
        description: "update phase"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - lineup
          - odds
          - result
          - final
          - backfill
      target_date:
        description: "target date YYYY-MM-DD optional"
        required: false
        default: ""
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-today-race-data
  cancel-in-progress: false

jobs:
  update-build-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync latest main
        run: |
          git pull --ff-only origin main

      - name: Update today race data
        run: |
          PHASE_ARG=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PHASE_ARG="--phase ${{ github.event.inputs.phase || 'auto' }}"
          else
            case "${{ github.event.schedule }}" in
              "10 21 * * *")
                PHASE_ARG="--phase lineup"
                ;;
              "0 23 * * *")
                PHASE_ARG="--phase lineup"
                ;;
              "0 1 * * *"|"0 5 * * *"|"0 11 * * *")
                PHASE_ARG="--phase odds"
                ;;
              "0 8 * * *")
                PHASE_ARG="--phase lineup"
                ;;
              "30 0-14 * * *"|"0 0-2,4-5,7-8,10-11,13-14 * * *"|"0 3 * * *"|"0 6 * * *"|"0 9 * * *"|"0 12 * * *")
                PHASE_ARG="--phase result"
                ;;
              "47 14 * * *")
                PHASE_ARG="--phase final"
                ;;
              "53 14 * * *")
                PHASE_ARG="--phase backfill"
                ;;
            esac
          fi

          if [ -n "$PHASE_ARG" ]; then
            npm run update:today-races:write -- $PHASE_ARG
          else
            npm run update:today-races:write
          fi

      - name: Validate today race data is not empty
        run: |
          node - <<'NODE'
          const fs = require("node:fs");

          const file = "public/data/races/today.generated.json";
          const payload = JSON.parse(fs.readFileSync(file, "utf8"));

          const venues = Array.isArray(payload.venues)
            ? payload.venues
            : [];

          const races = venues.flatMap((venue) =>
            Array.isArray(venue.races) ? venue.races : []
          );

          if (venues.length === 0 || races.length === 0) {
            throw new Error(
              `[guard] ${file} is empty: venues=${venues.length}, races=${races.length}`
            );
          }

          console.log(
            `[guard] ${file}: venues=${venues.length}, races=${races.length}`
          );
          NODE

      - name: Resolve KEIRIN.JP expected entry date
        if: (github.event_name == 'workflow_dispatch' && github.event.inputs.phase != 'backfill') || github.event.schedule == '10 21 * * *' || github.event.schedule == '0 23 * * *' || github.event.schedule == '0 1 * * *' || github.event.schedule == '0 3 * * *' || github.event.schedule == '0 5 * * *' || github.event.schedule == '0 6 * * *' || github.event.schedule == '0 8 * * *' || github.event.schedule == '0 9 * * *' || github.event.schedule == '0 11 * * *' || github.event.schedule == '0 12 * * *' || github.event.schedule == '47 14 * * *'
        shell: bash
        run: |
          echo "KEIRIN_JP_EXPECT_ENTRY_DATE=$(TZ=Asia/Tokyo date +%F)" >> "$GITHUB_ENV"

      - name: Update KEIRIN.JP official entries
        if: (github.event_name == 'workflow_dispatch' && github.event.inputs.phase != 'backfill') || github.event.schedule == '10 21 * * *' || github.event.schedule == '0 23 * * *' || github.event.schedule == '0 1 * * *' || github.event.schedule == '0 3 * * *' || github.event.schedule == '0 5 * * *' || github.event.schedule == '0 6 * * *' || github.event.schedule == '0 8 * * *' || github.event.schedule == '0 9 * * *' || github.event.schedule == '0 11 * * *' || github.event.schedule == '0 12 * * *' || github.event.schedule == '47 14 * * *'
        run: npm run update:keirin-jp-entries:write -- --expect-date="$KEIRIN_JP_EXPECT_ENTRY_DATE"

      - name: Validate KEIRIN.JP official entries
        if: (github.event_name == 'workflow_dispatch' && github.event.inputs.phase != 'backfill') || github.event.schedule == '10 21 * * *' || github.event.schedule == '0 23 * * *' || github.event.schedule == '0 1 * * *' || github.event.schedule == '0 3 * * *' || github.event.schedule == '0 5 * * *' || github.event.schedule == '0 6 * * *' || github.event.schedule == '0 8 * * *' || github.event.schedule == '0 9 * * *' || github.event.schedule == '0 11 * * *' || github.event.schedule == '0 12 * * *' || github.event.schedule == '47 14 * * *'
        run: npm run check:keirin-jp-entries -- --expect-date="$KEIRIN_JP_EXPECT_ENTRY_DATE" --require-complete

      - name: Resolve KEIRIN.JP expected result date
        if: github.event.schedule == '0 3 * * *' || github.event.schedule == '0 6 * * *' || github.event.schedule == '0 9 * * *' || github.event.schedule == '0 12 * * *' || github.event.schedule == '47 14 * * *' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.phase == 'final' || github.event.inputs.phase == 'backfill'))
        env:
          TARGET_DATE: ${{ github.event.inputs.target_date || '' }}
        shell: bash
        run: |
          if [ -n "$TARGET_DATE" ]; then
            echo "KEIRIN_JP_EXPECT_DATE=$TARGET_DATE" >> "$GITHUB_ENV"
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            echo "KEIRIN_JP_EXPECT_DATE=$(date -u +%F)" >> "$GITHUB_ENV"
          else
            echo "KEIRIN_JP_EXPECT_DATE=$(TZ=Asia/Tokyo date +%F)" >> "$GITHUB_ENV"
          fi
      - name: Update KEIRIN.JP official results
        if: github.event.schedule == '0 3 * * *' || github.event.schedule == '0 6 * * *' || github.event.schedule == '0 9 * * *' || github.event.schedule == '0 12 * * *' || github.event.schedule == '47 14 * * *' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.phase == 'final' || github.event.inputs.phase == 'backfill'))
        run: npm run update:keirin-jp-results:write -- --expect-date="$KEIRIN_JP_EXPECT_DATE"

      - name: Validate KEIRIN.JP official results
        if: github.event.schedule == '0 3 * * *' || github.event.schedule == '0 6 * * *' || github.event.schedule == '0 9 * * *' || github.event.schedule == '0 12 * * *' || github.event.schedule == '47 14 * * *' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.phase == 'final' || github.event.inputs.phase == 'backfill'))
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || \
             [ "${{ github.event.schedule }}" = "47 14 * * *" ] || \
             [ "${{ github.event.schedule }}" = "53 14 * * *" ]; then
            npm run check:keirin-jp-results -- --require-complete
          else
            npm run check:keirin-jp-results
          fi
      - name: Update upcoming race schedule
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '10 21 * * *'
        run: npm run update:schedule:upcoming

      - name: Notify Slack hits
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: node scripts/notify-slack-hits.mjs

      - name: Commit updated race and notification data
        id: commit_updated_data
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add public/data/races/today.generated.json
          git add public/data/races/upcoming-schedule.generated.json
          git add public/data/predictions/saved-predictions.generated.json
          git add public/data/races/keirin-jp-results.generated.json
          git add public/data/races/keirin-jp-entries.generated.json

          if git diff --cached --quiet; then
            echo "No today race data, upcoming schedule, KEIRIN.JP official feeds, or Slack notification state changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "Update race data, schedule, official feeds, and Slack notification state"
          git pull --rebase origin main
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Build for GitHub Pages
        if: steps.commit_updated_data.outputs.changed == 'true'
        run: npm run build:github

      - name: Upload GitHub Pages artifact
        if: steps.commit_updated_data.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        if: steps.commit_updated_data.outputs.changed == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
