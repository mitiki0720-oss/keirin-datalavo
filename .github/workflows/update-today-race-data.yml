name: Update today race data

on:
  schedule:
    # GitHub ActionsのcronはUTC。
    # 22,23時 UTC = 日本時間 7時・8時。
    # 0-14時 UTC = 日本時間 9時〜23時。
    # GitHub schedule の取りこぼし対策として、日本時間 7:00〜23:50 に10分ごと実行。
    - cron: "*/10 22,23 * * *"
    - cron: "*/10 0-14 * * *"
    - cron: "47 14 * * *" # 23:47 JST final result pickup
    - cron: "53 14 * * *" # 23:53 JST final result backup
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-today-race-data
  cancel-in-progress: false

jobs:
  update-build-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync latest main
        run: |
          git pull --ff-only origin main

      - name: Update today race data
        run: npm run update:today-races:write

      - name: Notify Slack hits
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: node scripts/notify-slack-hits.mjs

      - name: Commit updated race and notification data
        id: commit_updated_data
        run: |
          if git diff --quiet public/data/races/today.generated.json public/data/predictions/saved-predictions.generated.json; then
            echo "No today race data or Slack notification state changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add public/data/races/today.generated.json
          git add public/data/predictions/saved-predictions.generated.json

          git commit -m "Update today race data and Slack notification state"
          git pull --rebase origin main
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Build for GitHub Pages
        if: steps.commit_updated_data.outputs.changed == 'true'
        run: npm run build:github

      - name: Upload GitHub Pages artifact
        if: steps.commit_updated_data.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        if: steps.commit_updated_data.outputs.changed == 'true'
        id: deployment
        uses: actions/deploy-pages@v4