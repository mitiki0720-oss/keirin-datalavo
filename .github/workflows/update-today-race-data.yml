name: Update today race data

on:
  schedule:
    - cron: "10 21 * * *"  # 06:10 JST upcoming schedule
    - cron: "0 23 * * *"   # 08:00 JST lineup + morning odds seed
    - cron: "0 1 * * *"    # 10:00 JST day odds
    - cron: "0 5 * * *"    # 14:00 JST night odds
    - cron: "0 8 * * *"    # 17:00 JST midnight lineup
    - cron: "0 11 * * *"   # 20:00 JST midnight odds
    - cron: "30 0-14 * * *" # result refresh window: half-hour checkpoints
    - cron: "0 0-2,4-5,7-8,10-11,13-14 * * *" # result refresh window: top-of-hour checkpoints
    - cron: "0 3 * * *"     # 12:00 JST KEIRIN.JP official checkpoint
    - cron: "0 6 * * *"     # 15:00 JST KEIRIN.JP official checkpoint
    - cron: "0 9 * * *"     # 18:00 JST KEIRIN.JP official checkpoint
    - cron: "0 12 * * *"    # 21:00 JST KEIRIN.JP official checkpoint
    - cron: "47 14 * * *"  # 23:47 JST final result pickup
    - cron: "53 14 * * *"  # 23:53 JST backfill pickup
  workflow_dispatch:
    inputs:
      phase:
        description: "update phase"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - lineup
          - odds
          - result
          - final
          - backfill
      target_date:
        description: "target date YYYY-MM-DD optional"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: keirin-today-race-data
  cancel-in-progress: false

jobs:
  update-race-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync latest main
        run: |
          git pull --ff-only origin main

      - name: Update today race data
        env:
          REQUESTED_TARGET_DATE: ${{ github.event.inputs.target_date || '' }}
        run: |
          JST_DATE="$(TZ=Asia/Tokyo date +%F)"
          if [ -n "$REQUESTED_TARGET_DATE" ] && [ "$REQUESTED_TARGET_DATE" != "$JST_DATE" ]; then
            echo "[guard] target_date is not the current JST date: $REQUESTED_TARGET_DATE != $JST_DATE"
            exit 1
          fi
          if [ "${{ github.event.schedule }}" = "47 14 * * *" ] || [ "${{ github.event.schedule }}" = "53 14 * * *" ]; then
            if [ "$JST_DATE" != "$(date -u +%F)" ]; then
              echo "[guard] final/backfill crossed the JST date boundary; refusing current-day overwrite"
              exit 1
            fi
          fi
          PHASE_ARG=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PHASE_ARG="--phase ${{ github.event.inputs.phase || 'auto' }}"
          else
            case "${{ github.event.schedule }}" in
              "10 21 * * *")
                PHASE_ARG="--phase lineup"
                ;;
              "0 23 * * *")
                PHASE_ARG="--phase lineup"
                ;;
              "0 1 * * *"|"0 5 * * *"|"0 11 * * *")
                PHASE_ARG="--phase odds"
                ;;
              "0 8 * * *")
                PHASE_ARG="--phase lineup"
                ;;
              "30 0-14 * * *"|"0 0-2,4-5,7-8,10-11,13-14 * * *"|"0 3 * * *"|"0 6 * * *"|"0 9 * * *"|"0 12 * * *")
                PHASE_ARG="--phase result"
                ;;
              "47 14 * * *")
                PHASE_ARG="--phase final"
                ;;
              "53 14 * * *")
                PHASE_ARG="--phase backfill"
                ;;
            esac
          fi

          if [ -n "$PHASE_ARG" ]; then
            npm run update:today-races:write -- $PHASE_ARG
          else
            npm run update:today-races:write
          fi

      - name: Validate today race data is not empty
        run: |
          node - <<'NODE'
          const fs = require("node:fs");

          const file = "public/data/races/today.generated.json";
          const payload = JSON.parse(fs.readFileSync(file, "utf8"));

          const venues = Array.isArray(payload.venues)
            ? payload.venues
            : [];

          const races = venues.flatMap((venue) =>
            Array.isArray(venue.races) ? venue.races : []
          );

          if (venues.length === 0 || races.length === 0) {
            throw new Error(
              `[guard] ${file} is empty: venues=${venues.length}, races=${races.length}`
            );
          }

          console.log(
            `[guard] ${file}: venues=${venues.length}, races=${races.length}`
          );
          NODE

      - name: Resolve KEIRIN.JP expected entry date
        if: (github.event_name == 'workflow_dispatch' && github.event.inputs.phase != 'backfill') || github.event.schedule == '10 21 * * *' || github.event.schedule == '0 23 * * *' || github.event.schedule == '0 1 * * *' || github.event.schedule == '0 3 * * *' || github.event.schedule == '0 5 * * *' || github.event.schedule == '0 6 * * *' || github.event.schedule == '0 8 * * *' || github.event.schedule == '0 9 * * *' || github.event.schedule == '0 11 * * *' || github.event.schedule == '0 12 * * *' || github.event.schedule == '47 14 * * *'
        shell: bash
        run: |
          echo "KEIRIN_JP_EXPECT_ENTRY_DATE=$(TZ=Asia/Tokyo date +%F)" >> "$GITHUB_ENV"

      - name: Update KEIRIN.JP official entries
        if: (github.event_name == 'workflow_dispatch' && github.event.inputs.phase != 'backfill') || github.event.schedule == '10 21 * * *' || github.event.schedule == '0 23 * * *' || github.event.schedule == '0 1 * * *' || github.event.schedule == '0 3 * * *' || github.event.schedule == '0 5 * * *' || github.event.schedule == '0 6 * * *' || github.event.schedule == '0 8 * * *' || github.event.schedule == '0 9 * * *' || github.event.schedule == '0 11 * * *' || github.event.schedule == '0 12 * * *' || github.event.schedule == '47 14 * * *'
        run: npm run update:keirin-jp-entries:write -- --expect-date="$KEIRIN_JP_EXPECT_ENTRY_DATE"

      - name: Validate KEIRIN.JP official entries
        if: (github.event_name == 'workflow_dispatch' && github.event.inputs.phase != 'backfill') || github.event.schedule == '10 21 * * *' || github.event.schedule == '0 23 * * *' || github.event.schedule == '0 1 * * *' || github.event.schedule == '0 3 * * *' || github.event.schedule == '0 5 * * *' || github.event.schedule == '0 6 * * *' || github.event.schedule == '0 8 * * *' || github.event.schedule == '0 9 * * *' || github.event.schedule == '0 11 * * *' || github.event.schedule == '0 12 * * *' || github.event.schedule == '47 14 * * *'
        run: npm run check:keirin-jp-entries -- --expect-date="$KEIRIN_JP_EXPECT_ENTRY_DATE" --require-complete

      - name: Generate KURARI EX race risk for current day
        if: (github.event_name == 'workflow_dispatch' && github.event.inputs.phase != 'backfill') || github.event.schedule == '10 21 * * *' || github.event.schedule == '0 23 * * *' || github.event.schedule == '0 1 * * *' || github.event.schedule == '0 3 * * *' || github.event.schedule == '0 5 * * *' || github.event.schedule == '0 6 * * *' || github.event.schedule == '0 8 * * *' || github.event.schedule == '0 9 * * *' || github.event.schedule == '0 11 * * *' || github.event.schedule == '0 12 * * *' || github.event.schedule == '47 14 * * *'
        run: |
          node - <<'NODE'
          const fs = require("node:fs");

          const today = JSON.parse(fs.readFileSync("public/data/races/today.generated.json", "utf8"));
          const entries = JSON.parse(fs.readFileSync("public/data/races/keirin-jp-entries.generated.json", "utf8"));

          if (!today.date || !entries.date || today.date !== entries.date) {
            throw new Error(
              `[guard] race-risk date mismatch: today=${today.date || "missing"}, entries=${entries.date || "missing"}`
            );
          }

          console.log(`[guard] race-risk source date=${today.date}`);
          NODE

          node scripts/kurari-ex/generate-kurari-ex-race-risk.mjs
          node scripts/check-kurari-ex-race-risk.mjs
          node scripts/kurari-ex/archive-kurari-ex-race-risk.mjs
          node scripts/check-kurari-ex-race-risk-history.mjs

      - name: Resolve KEIRIN.JP expected result date
        if: github.event.schedule == '0 3 * * *' || github.event.schedule == '0 6 * * *' || github.event.schedule == '0 9 * * *' || github.event.schedule == '0 12 * * *' || github.event.schedule == '47 14 * * *' || github.event.schedule == '53 14 * * *' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.phase == 'final' || github.event.inputs.phase == 'backfill'))
        env:
          TARGET_DATE: ${{ github.event.inputs.target_date || '' }}
        shell: bash
        run: |
          if [ -n "$TARGET_DATE" ]; then
            echo "KEIRIN_JP_EXPECT_DATE=$TARGET_DATE" >> "$GITHUB_ENV"
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            echo "KEIRIN_JP_EXPECT_DATE=$(date -u +%F)" >> "$GITHUB_ENV"
          else
            echo "KEIRIN_JP_EXPECT_DATE=$(TZ=Asia/Tokyo date +%F)" >> "$GITHUB_ENV"
          fi
      - name: Update KEIRIN.JP official results
        if: github.event.schedule == '0 3 * * *' || github.event.schedule == '0 6 * * *' || github.event.schedule == '0 9 * * *' || github.event.schedule == '0 12 * * *' || github.event.schedule == '47 14 * * *' || github.event.schedule == '53 14 * * *' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.phase == 'final' || github.event.inputs.phase == 'backfill'))
        run: npm run update:keirin-jp-results:write -- --expect-date="$KEIRIN_JP_EXPECT_DATE"

      - name: Validate KEIRIN.JP official results
        if: github.event.schedule == '0 3 * * *' || github.event.schedule == '0 6 * * *' || github.event.schedule == '0 9 * * *' || github.event.schedule == '0 12 * * *' || github.event.schedule == '47 14 * * *' || github.event.schedule == '53 14 * * *' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.phase == 'final' || github.event.inputs.phase == 'backfill'))
        shell: bash
        run: |
          # Late official publication must not discard already confirmed races.
          # Pending races remain pending; the normal checker still validates the feed.
          npm run check:keirin-jp-results -- --expect-date="$KEIRIN_JP_EXPECT_DATE" --require-no-errors
      - name: Archive Review official results
        id: review_official_archive
        if: github.event.schedule == '47 14 * * *' || github.event.schedule == '53 14 * * *'
        continue-on-error: true
        shell: bash
        run: |
          node scripts/check-keirin-jp-results.mjs --expect-date="$KEIRIN_JP_EXPECT_DATE" --require-complete --require-no-errors
          node scripts/archive-keirin-review-official-results.mjs --expect-date="$KEIRIN_JP_EXPECT_DATE"
          echo "REVIEW_OFFICIAL_ARCHIVE_DATE=$KEIRIN_JP_EXPECT_DATE" >> "$GITHUB_ENV"

      - name: Report Review official archive failure
        if: always() && steps.review_official_archive.outcome == 'failure'
        run: |
          echo "::warning title=Review official archive unavailable::The daily Review archive was not created or changed; inspect the preceding date, completeness, source, identity, or write-once error. Validated today data will continue to its commit gate."
          echo "Review official archive: FAILED / not updated. Check the archive step before treating this date as available in Review." >> "$GITHUB_STEP_SUMMARY"

      - name: Generate KURARI EX prediction performance
        if: github.event.schedule == '47 14 * * *' || (github.event_name == 'workflow_dispatch' && github.event.inputs.phase == 'final')
        shell: bash
        run: |
          echo "PERFORMANCE_GENERATED=false" >> "$GITHUB_ENV"
          PREDICTION_FILE="public/data/predictions/daily/${KEIRIN_JP_EXPECT_DATE:0:7}/${KEIRIN_JP_EXPECT_DATE}.generated.json"
          if [ ! -f "$PREDICTION_FILE" ]; then
            echo "prediction performance skipped: no pre-race prediction daily snapshot for ${KEIRIN_JP_EXPECT_DATE}"
            exit 0
          fi

          node scripts/kurari-ex/evaluate-kurari-ex-prediction-performance.mjs \
            --date "$KEIRIN_JP_EXPECT_DATE" \
            --write

          PERFORMANCE_DAILY="public/data/analytics/kurari-ex/prediction-performance/daily/${KEIRIN_JP_EXPECT_DATE:0:7}/${KEIRIN_JP_EXPECT_DATE}.generated.json"
          PERFORMANCE_INDEX="public/data/analytics/kurari-ex/prediction-performance/index.generated.json"
          node scripts/check-kurari-ex-prediction-performance.mjs --file "$PERFORMANCE_DAILY"

          node - <<'NODE'
          const fs = require("node:fs");
          const expectedDate = process.env.KEIRIN_JP_EXPECT_DATE;
          const expectedFile = `/data/analytics/kurari-ex/prediction-performance/daily/${expectedDate.slice(0, 7)}/${expectedDate}.generated.json`;
          const index = JSON.parse(fs.readFileSync("public/data/analytics/kurari-ex/prediction-performance/index.generated.json", "utf8"));
          if (index.version !== "kurari-ex-prediction-performance/v1") {
            throw new Error(`[guard] prediction-performance index version mismatch: ${index.version || "missing"}`);
          }
          if (index.latestDate !== expectedDate) {
            throw new Error(`[guard] prediction-performance latestDate mismatch: ${index.latestDate || "missing"} != ${expectedDate}`);
          }
          if (index.latestFile !== expectedFile) {
            throw new Error(`[guard] prediction-performance latestFile mismatch: ${index.latestFile || "missing"} != ${expectedFile}`);
          }
          console.log(`[guard] prediction-performance index latestDate=${index.latestDate}`);
          NODE

          echo "PERFORMANCE_GENERATED=true" >> "$GITHUB_ENV"
          echo "PERFORMANCE_DATE=$KEIRIN_JP_EXPECT_DATE" >> "$GITHUB_ENV"
      - name: Update upcoming race schedule
        id: upcoming_schedule
        if: github.event.schedule == '10 21 * * *'
        continue-on-error: true
        run: npm run update:schedule:upcoming

      - name: Report upcoming schedule failure
        if: always() && steps.upcoming_schedule.outcome == 'failure'
        run: |
          echo "::warning title=CTC schedule unavailable::Upcoming schedule was not updated; validated today race data will continue to the commit gate. See the preceding CTC HTTP/error log."
          echo "CTC upcoming schedule: FAILED / not updated. Today race data has a separate validation and commit gate." >> "$GITHUB_STEP_SUMMARY"

      - name: Commit updated race data
        id: commit_updated_data
        run: |
          check_current_feed_date() {
            node --input-type=module <<'NODE'
          import fs from "node:fs";
          import { assertCurrentDayWriteDate } from "./scripts/lib/official-today-source.mjs";
          const feed = JSON.parse(fs.readFileSync("public/data/races/today.generated.json", "utf8"));
          const jstDate = new Intl.DateTimeFormat("sv-SE", {
            timeZone: "Asia/Tokyo", year: "numeric", month: "2-digit", day: "2-digit",
          }).format(new Date());
          assertCurrentDayWriteDate(feed.date, jstDate, "workflow publish");
          NODE
          }
          check_current_feed_date

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add public/data/races/today.generated.json
          git add public/data/races/upcoming-schedule.generated.json
          git add public/data/races/keirin-jp-results.generated.json
          git add public/data/races/keirin-jp-entries.generated.json
          if [ -n "${REVIEW_OFFICIAL_ARCHIVE_DATE:-}" ]; then
            if [ "$REVIEW_OFFICIAL_ARCHIVE_DATE" != "$KEIRIN_JP_EXPECT_DATE" ]; then
              echo "[guard] Review archive date mismatch: $REVIEW_OFFICIAL_ARCHIVE_DATE != $KEIRIN_JP_EXPECT_DATE"
              exit 1
            fi
            git add -- "public/data/review-page/official-results/${REVIEW_OFFICIAL_ARCHIVE_DATE}.generated.json"
          fi
          git add public/data/analytics/kurari-ex/race-risk/index.generated.json
          RISK_DATE="$(node -e 'const fs=require("fs"); const data=JSON.parse(fs.readFileSync("public/data/analytics/kurari-ex/race-risk/index.generated.json","utf8")); if(!/^\d{4}-\d{2}-\d{2}$/.test(data.period?.date || "")) process.exit(1); process.stdout.write(data.period.date);')"
          git add "public/data/analytics/kurari-ex/race-risk-history/${RISK_DATE}.generated.json"
          if [ "${PERFORMANCE_GENERATED:-false}" = "true" ]; then
            PERFORMANCE_DATE="$(node -e 'const fs=require("fs"); const expected=process.env.PERFORMANCE_DATE; const index=JSON.parse(fs.readFileSync("public/data/analytics/kurari-ex/prediction-performance/index.generated.json","utf8")); if(!expected || index.latestDate !== expected) process.exit(1); process.stdout.write(index.latestDate);')"
            git add "public/data/analytics/kurari-ex/prediction-performance/index.generated.json"
            git add "public/data/analytics/kurari-ex/prediction-performance/daily/${PERFORMANCE_DATE:0:7}/${PERFORMANCE_DATE}.generated.json"
          fi

          if git diff --cached --quiet; then
            echo "No today race data, upcoming schedule, KEIRIN.JP official feeds, race-risk archive, or prediction-performance changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "Update race data, schedule, and official feeds"
          git pull --rebase origin main
          check_current_feed_date
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
