name: Deploy KURARI DATA LAVO to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_run:
    workflows:
      - Update today race data
    types:
      - completed
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    outputs:
      run_followup: ${{ steps.upstream_update.outputs.run_followup }}
    runs-on: ubuntu-latest

    steps:
      - name: Check upstream race update was performed
        id: upstream_update
        uses: actions/github-script@v7
        with:
          script: |
            let runFollowup = true;
            if (context.eventName === 'workflow_run') {
              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                ...context.repo, run_id: context.payload.workflow_run.id, filter: 'latest', per_page: 100,
              });
              const job = jobs.find((item) => item.name === 'update-race-data');
              const step = job?.steps?.find((item) => item.name === 'Update today race data');
              if (!step || !['success', 'skipped'].includes(step.conclusion)) {
                throw new Error('Unable to verify upstream race update; refusing follow-up');
              }
              runFollowup = step.conclusion === 'success';
              if (!runFollowup) {
                core.notice('Upstream race update was skipped; no deployment or Slack delivery');
                await core.summary.addHeading('更新スキップのため後続処理なし')
                  .addRaw('元のデータ更新ステップがスキップされたため、公開・通知は実行しません。\n')
                  .write();
              }
            }
            core.setOutput('run_followup', String(runFollowup));

      - name: Checkout
        if: steps.upstream_update.outputs.run_followup == 'true'
        uses: actions/checkout@v4

      - name: Setup Node
        if: steps.upstream_update.outputs.run_followup == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.upstream_update.outputs.run_followup == 'true'
        run: npm ci

      - name: Build for GitHub Pages
        if: steps.upstream_update.outputs.run_followup == 'true'
        run: npm run build:github

      - name: Upload GitHub Pages artifact
        if: steps.upstream_update.outputs.run_followup == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build
    if: needs.build.outputs.run_followup == 'true'

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
