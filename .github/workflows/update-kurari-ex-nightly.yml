name: Update KURARI EX nightly

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: "YYYY-MM-DD, today, or yesterday"
        required: false
        default: "today"
  schedule:
    - cron: "58 23 * * *"
      timezone: "Asia/Tokyo"

permissions:
  contents: write

concurrency:
  group: keirin-data-auto-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: git pull --ff-only origin main

      - name: Resolve nightly target date
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            REQUESTED="${{ github.event.inputs.target_date || 'today' }}"
            case "$REQUESTED" in
              today) TARGET_DATE="$(TZ=Asia/Tokyo date +%F)" ;;
              yesterday) TARGET_DATE="$(TZ=Asia/Tokyo date -d yesterday +%F)" ;;
              ????-??-??) TARGET_DATE="$REQUESTED" ;;
              *) echo "Invalid target_date: $REQUESTED" >&2; exit 1 ;;
            esac
          else
            JST_HOUR="$(TZ=Asia/Tokyo date +%H)"
            if [ "$JST_HOUR" -lt 6 ]; then
              TARGET_DATE="$(TZ=Asia/Tokyo date -d yesterday +%F)"
            else
              TARGET_DATE="$(TZ=Asia/Tokyo date +%F)"
            fi
          fi
          echo "TARGET_DATE=$TARGET_DATE" >> "$GITHUB_ENV"
          echo "KURARI EX target date: $TARGET_DATE"

      - name: Update KURARI EX
        run: |
          set +e
          node scripts/run-kurari-ex-nightly-update.mjs \
            --date="$TARGET_DATE" \
            --allow-enrichment-upgrade
          STATUS=$?
          set -e
          if [ "$STATUS" -eq 2 ]; then
            echo "Nightly update safely skipped because the feed is pending or mismatched."
            exit 0
          fi
          exit "$STATUS"

      - name: Commit changed KURARI EX data
        run: |
          git add -A public/data/analytics/kurari-ex
          if git diff --cached --quiet; then
            echo "No KURARI EX changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update KURARI EX nightly data ${TARGET_DATE}"

          for attempt in 1 2; do
            if git pull --rebase origin main && git push origin main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            if [ "$attempt" -eq 2 ]; then
              exit 1
            fi
            sleep 5
          done
